<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Filters</title>
    <style>
      img {
      }

      .Nature {
        filter: brightness(800%) contrast(100%);
      }

      .Hrithik-Roshan {
        filter: grayscale(100%) sepia(100%) opacity(1);
      }

      .Shah-Rukh-Khan {
        filter: invert(1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        class="Nature"
        src="https://i0.wp.com/picjumbo.com/wp-content/uploads/silhouettes-of-hawaiian-palms-at-a-gorgeous-sunset-free-image.jpeg?h=800&quality=80"
        alt="image"
      />
      <img
        class="Hrithik-Roshan"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQiDt2mFvfrw7nZlHPg9oXy-ZeukH9DY5UNa2LYr7XRVQ&s=10"
        alt="Hrithik Roshan"
      />
      <img
        class="Shah-Rukh-Khan"
        src="https://upload.wikimedia.org/wikipedia/commons/b/be/Shah_Rukh_Khan_at_Jab_Harry_Met_Sejal_new_song_launch_%27Beech_Beech_Mein%27.jpg?utm_source=hif.wikipedia.org&utm_campaign=index&utm_content=original"
        alt="Shah Rukh Khan"
      />
    </div>
  </body>
</html>
