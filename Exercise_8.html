<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Animation</title>
    <style>
        .container {
            background-color: blue;
            width: 100vw;
            height: 100vh;
        }

        .ball {
            background-color: red;
            height: 10vh;
            width: 10vw;
            border-radius: 30px;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: identifier1 3s linear infinite, identifier2 1s ease-out infinite alternate;
        }

        @keyframes identifier1 {
            from {
                left: 0%;
            }
            to {
                left: 100%;
            }
        }
        @keyframes identifier2 {
            from {
                bottom: 0%;
            }
            to {
                bottom: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="ball">

        </div>
    </div>
</body>
</html>
